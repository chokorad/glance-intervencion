<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Seguimiento Intervención</title>
<style>
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --border: #e3e1db;
    --text: #1c1c1a;
    --text-secondary: #6b6a63;
    --text-muted: #9b9a92;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 12px 12px 60px; }

  .tabs-wrap { position: sticky; top: 0; background: var(--bg); padding: 8px 0 4px; z-index: 5; }
  .tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  .tabs.secondary { margin-bottom: 14px; }
  .tab-btn {
    flex: 1; padding: 9px 4px; font-size: 12.5px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
    cursor: pointer; text-align: center;
  }
  .tabs.secondary .tab-btn { padding: 7px 4px; font-size: 12px; }
  .tab-btn.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .cache-note { font-size: 10.5px; color: var(--text-muted); margin: 0; text-align: right; }
  .version-tag { position: fixed; bottom: 6px; right: 8px; font-size: 10px; color: var(--text-muted); opacity: 0.55; z-index: 1; }
  .paste-toast {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%) translateY(-10px);
    background: #1c1c1a; color: #fff; font-size: 12.5px; padding: 9px 14px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 20; max-width: 90%; text-align: center;
  }
  .paste-toast.show { opacity: 0.95; transform: translateX(-50%) translateY(0); }
  .paste-toast.error { background: #791f1f; }

  .date-header { font-size: 12px; color: var(--text-muted); margin: 18px 2px 6px; text-transform: capitalize; }
  .date-header:first-of-type { margin-top: 0; }

  .card { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-bottom: 8px; overflow: hidden; }
  .card-summary { display: flex; align-items: center; gap: 10px; padding: 11px; cursor: pointer; }
  .check { width: 18px; height: 18px; flex-shrink: 0; }
  .card.checked { opacity: 0.55; }
  .card.checked .card-name { text-decoration: line-through; }
  .reorder { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
  .reorder button { border: none; background: none; padding: 2px 4px; font-size: 10px; line-height: 1; color: var(--text-muted); cursor: pointer; }
  .reorder button:disabled { opacity: 0.25; cursor: default; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--accent-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .card-summary-text { flex: 1; min-width: 0; }
  .card-name { font-size: 14px; font-weight: 600; }
  .card-sub { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { font-size: 13px; color: var(--text-muted); transition: transform 0.15s; }
  .card.open .chev { transform: rotate(180deg); }

  .card-detail { display: none; padding: 0 11px 11px; font-size: 13px; }
  .card.open .card-detail { display: block; }
  .detail-row { border-top: 1px solid var(--border); padding-top: 9px; margin-bottom: 9px; }
  .detail-row p { margin: 0 0 5px; line-height: 1.4; }
  .detail-label { color: var(--text-secondary); }

  .img-toggle { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--border); padding-top: 9px; cursor: pointer; font-size: 12px; color: var(--text-secondary); }
  .img-toggle .chev { margin-left: auto; }
  .img-panel { display: none; margin-top: 8px; }
  .img-panel.open { display: block; }

  .thumb-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--accent-bg); }
  .thumb-add {
    width: 60px; height: 60px; border-radius: 8px; border: 1px dashed var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 20px; cursor: pointer;
  }
  .thumb-add-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .thumb-add-wrap.busy .thumb-add { pointer-events: none; opacity: 0.4; }
  .upload-progress { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; }

  .link-list { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 9px; }
  .link-item { font-size: 12.5px; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 5px; }
  .link-item .tag { margin-left: auto; font-size: 10px; color: var(--text-muted); }
  .link-add-row { display: flex; gap: 6px; margin-top: 4px; }
  .link-add-row input { flex: 1; font-size: 12px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); }
  .link-add-row button, .thumb-add-inline { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }

  .nota-input { width: 100%; min-height: 50px; font-size: 12.5px; font-family: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); resize: vertical; margin-top: 3px; }
  .nota-saved { font-size: 10px; color: var(--text-muted); opacity: 0; transition: opacity 0.2s; }
  .nota-saved.show { opacity: 1; }
  .img-panel { outline: none; }
  .img-panel:focus { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 8px; }
  .paste-hint { font-size: 10.5px; color: var(--text-muted); margin: 4px 0 0; }
  .empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 0; }
  .loading { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }
  .sentinel { height: 1px; }

  .gate { max-width: 320px; margin: 80px auto; padding: 0 16px; text-align: center; }
  .gate h1 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .gate input { width: 100%; font-size: 15px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 10px; text-align: center; }
  .gate button { width: 100%; font-size: 14px; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
  .gate .gate-error { color: #a32d2d; font-size: 12px; margin-top: 8px; display: none; }

  .layout { display: none; flex-direction: column; gap: 20px; max-width: 820px; margin: 0 auto; align-items: center; }
  .sidebar { display: block; width: 100%; max-width: 480px; flex-shrink: 0; padding: 0 12px; }
  @media (min-width: 900px) {
    .layout { flex-direction: row; align-items: flex-start; }
    .sidebar { width: 280px; max-width: 280px; position: sticky; top: 12px; padding: 12px 0 0; }
  }
  .sidebar-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  @media (min-width: 900px) { .sidebar-card { max-height: 80vh; overflow-y: auto; } }
  .sidebar-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .sidebar-toggle { display: flex; gap: 4px; margin-bottom: 10px; }
  .sidebar-toggle button { flex: 1; font-size: 11px; padding: 5px 2px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; }
  .sidebar-toggle button.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .sidebar-date {
    font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-bg);
    padding: 5px 9px; border-radius: 6px; margin: 16px 0 8px; text-transform: capitalize;
  }
  .sidebar-date:first-of-type { margin-top: 0; }
  .sidebar-row { padding: 6px 2px; border-top: 1px solid var(--border); }
  .sidebar-row:first-of-type { border-top: none; }
  .sidebar-name { display: block; font-size: 12px; font-weight: 500; }
  .sidebar-proc { display: block; font-size: 11px; color: var(--text-secondary); }
  .sidebar-empty { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1>Glance Intervención</h1>
  <input type="password" id="gate-code" placeholder="Código de acceso" autocomplete="off">
  <button id="gate-btn">Entrar</button>
  <p class="gate-error" id="gate-error">Código incorrecto.</p>
</div>

<div class="layout" id="layout">
<div class="app" id="app">
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab-btn" data-primary="consulta">Consulta</button>
      <button class="tab-btn" data-primary="intervenciones">Intervenciones</button>
    </div>
    <div class="tabs secondary">
      <button class="tab-btn" data-institucion="issste">ISSSTE</button>
      <button class="tab-btn" data-institucion="chisssmecali">ISSSTECali</button>
      <button class="tab-btn" id="refresh-btn" title="Actualizar" style="flex:0 0 40px;">↻</button>
    </div>
    <p class="cache-note" id="cache-note"></p>
  </div>
  <div id="content"></div>
  <div class="sentinel" id="sentinel"></div>
</div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-card">
    <p class="sidebar-title">Upcoming</p>
    <div class="sidebar-toggle">
      <button data-inst="issste" class="active">ISSSTE</button>
      <button data-inst="chisssmecali">ISSSTECali</button>
    </div>
    <div id="sidebar-list"><p class="sidebar-empty">Cargando…</p></div>
  </div>
</div>
</div>
<div class="version-tag" id="version-tag"></div>
<div class="paste-toast" id="paste-toast"></div>

<script>
// ============================= CONFIG =============================
// Pega aquí la URL /exec de tu Web App de Apps Script una vez publicada
const API_URL = 'https://script.google.com/macros/s/AKfycbwEjfZ8lcHxVKtTCFDKeQEMFZBiqZTsi-URF1kbRhw-aSpOggGYZACEzBwcvQTcjEoF/exec';

// Súbelo cada vez que edites este archivo, así el numerito de abajo a la derecha
// te dice si el navegador ya tiene la versión que acabas de subir a GitHub Pages.
const APP_VERSION = '2026-08-11.8';
document.getElementById('version-tag').textContent = 'v' + APP_VERSION;

const PAGE_SIZE = 4; // cuántos grupos de fecha se muestran por "página" del scroll

let state = {
  primary: 'consulta',
  institucion: 'issste',
  groups: [],
  renderedCount: 0,
  cache: {},
};

// Declarado aquí arriba (no más abajo) porque showApp() puede llamar a renderSidebar()
// de forma síncrona antes de que el script termine de correr todo lo de abajo.
let sidebarInst = 'issste';

const contentEl = document.getElementById('content');

document.querySelectorAll('[data-primary]').forEach(btn => {
  btn.addEventListener('click', () => { state.primary = btn.dataset.primary; onModeChange(); });
});
document.querySelectorAll('[data-institucion]').forEach(btn => {
  btn.addEventListener('click', () => { state.institucion = btn.dataset.institucion; onModeChange(); });
});
document.getElementById('refresh-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  fetchMode(state.primary + '_' + state.institucion);
});

// ============================= CACHE (evita recargar por red al cambiar de tab) =============================
const CACHE_PREFIX = 'glance_data_';

function getCachedGroups(mode) {
  if (state.cache[mode]) return state.cache[mode];
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + mode);
    if (raw) { state.cache[mode] = JSON.parse(raw); return state.cache[mode]; }
  } catch (e) {}
  return null;
}
function setCachedGroups(mode, groups) {
  const entry = { groups: groups, ts: Date.now() };
  state.cache[mode] = entry;
  try { localStorage.setItem(CACHE_PREFIX + mode, JSON.stringify(entry)); } catch (e) {}
}
// Vuelve a guardar el estado actual en caché (memoria + localStorage) tras un cambio local
// (checkbox / reorden), para que un refresh de página no se vea "revertido" antes del próximo fetch.
function touchCacheForCurrentMode() {
  setCachedGroups(state.primary + '_' + state.institucion, state.groups);
}

function showCacheNote(ts) {
  const note = document.getElementById('cache-note');
  if (!ts) { note.textContent = ''; return; }
  const mins = Math.round((Date.now() - ts) / 60000);
  note.textContent = mins < 1 ? 'Actualizado hace instantes' : ('Actualizado hace ' + mins + ' min · ↻ para refrescar');
}

function onModeChange() {
  document.querySelectorAll('[data-primary]').forEach(b => b.classList.toggle('active', b.dataset.primary === state.primary));
  document.querySelectorAll('[data-institucion]').forEach(b => b.classList.toggle('active', b.dataset.institucion === state.institucion));
  const mode = state.primary + '_' + state.institucion;
  const cached = getCachedGroups(mode);
  if (cached) {
    renderGroups(cached.groups);
    showCacheNote(cached.ts);
  } else {
    fetchMode(mode);
  }
}

// Trae las otras 3 vistas en segundo plano (sin bloquear ni mostrar "Cargando") para que
// ya estén listas si la conexión falla más tarde durante la consulta.
function prefetchOtherModes() {
  const all = ['consulta_issste', 'consulta_chisssmecali', 'intervenciones_issste', 'intervenciones_chisssmecali'];
  const current = state.primary + '_' + state.institucion;
  all.forEach(m => { if (m !== current && !getCachedGroups(m)) fetchMode(m, true); });
}

// ============================= GATE (PIN) =============================
const CODE_KEY = 'glance_access_code';
const ACTIVITY_KEY = 'glance_last_activity';
const SESSION_TTL_MS = 8 * 60 * 60 * 1000; // 8 horas de inactividad -> vuelve a pedir el PIN

const gateEl = document.getElementById('gate');
const layoutEl = document.getElementById('layout');
const gateInput = document.getElementById('gate-code');
const gateError = document.getElementById('gate-error');

function getCode() { return localStorage.getItem(CODE_KEY) || ''; }

function touchActivity() { localStorage.setItem(ACTIVITY_KEY, String(Date.now())); }

function sessionExpired() {
  const last = Number(localStorage.getItem(ACTIVITY_KEY) || 0);
  return (Date.now() - last) > SESSION_TTL_MS;
}

function showApp() {
  touchActivity();
  gateEl.style.display = 'none';
  layoutEl.style.display = 'flex';
  onModeChange();
  renderSidebar(); // pinta lo que ya haya en caché de inmediato
  setTimeout(prefetchOtherModes, 1000); // deja que la vista actual cargue primero
}

document.getElementById('gate-btn').addEventListener('click', tryEnter);
gateInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryEnter(); });

function tryEnter() {
  const code = gateInput.value.trim();
  if (!code) return;
  localStorage.setItem(CODE_KEY, code);
  gateError.style.display = 'none';
  showApp();
}

function rejectCode(message) {
  localStorage.removeItem(CODE_KEY);
  localStorage.removeItem(ACTIVITY_KEY);
  layoutEl.style.display = 'none';
  gateEl.style.display = 'block';
  gateError.textContent = message || 'Código incorrecto.';
  gateError.style.display = 'block';
  gateInput.value = '';
}

// Marca actividad con cualquier toque dentro de la app (mantiene viva la sesión mientras la usas)
layoutEl.addEventListener('click', touchActivity);

// Al abrir: si hay código guardado y no han pasado 8h de inactividad, entra directo.
// Si pasaron 8h, se pide el PIN de nuevo (sin borrar nada más, solo re-autentica).
if (getCode() && !sessionExpired()) {
  showApp();
} else if (getCode() && sessionExpired()) {
  rejectCode('Sesión expirada por inactividad. Ingresa tu código.');
}

function renderGroups(groups) {
  state.groups = groups || [];
  state.renderedCount = 0;
  renderNextPage();
}

// silent=true -> no muestra "Cargando" ni pisa lo que se ve (se usa para el prefetch en segundo plano)
async function fetchMode(mode, silent) {
  const isCurrent = mode === (state.primary + '_' + state.institucion);
  if (!silent && isCurrent) contentEl.innerHTML = '<div class="loading">Cargando…</div>';
  try {
    const res = await fetch(API_URL + '?mode=' + encodeURIComponent(mode) + '&code=' + encodeURIComponent(getCode()));
    const data = await res.json();
    if (data.error === 'codigo_invalido') { rejectCode(); return; }
    if (!data.ok) throw new Error(data.error || 'Error desconocido');
    setCachedGroups(mode, data.groups || []);
    if (mode === (state.primary + '_' + state.institucion)) {
      renderGroups(data.groups || []);
      showCacheNote(Date.now());
    }
    if (mode === 'intervenciones_' + sidebarInst) renderSidebar();
  } catch (err) {
    if (!silent && isCurrent) contentEl.innerHTML = '<div class="empty">No se pudo cargar. ' + escapeHtml(String(err)) + '</div>';
  }
}

// ============================= SIDEBAR "UPCOMING" (siempre visible en pantallas anchas) =============================
function renderSidebar() {
  const mode = 'intervenciones_' + sidebarInst;
  const cached = getCachedGroups(mode);
  const list = document.getElementById('sidebar-list');
  if (!cached) {
    list.innerHTML = '<p class="sidebar-empty">Cargando…</p>';
    fetchMode(mode, true);
    return;
  }
  if (!cached.groups.length) {
    list.innerHTML = '<p class="sidebar-empty">Sin procedimientos próximos.</p>';
    return;
  }
  list.innerHTML = '';
  cached.groups.forEach(group => {
    const h = document.createElement('p');
    h.className = 'sidebar-date';
    h.textContent = formatDateLabel(group.date);
    list.appendChild(h);
    group.patients.forEach(p => {
      const row = document.createElement('div');
      row.className = 'sidebar-row';
      row.innerHTML = `<span class="sidebar-name">${escapeHtml(p.nombre)}${p.edad ? ', ' + escapeHtml(String(p.edad)) : ''}</span><span class="sidebar-proc">${escapeHtml(p.procedimiento || '')}</span>`;
      list.appendChild(row);
    });
  });
}

document.querySelectorAll('#sidebar [data-inst]').forEach(btn => {
  btn.addEventListener('click', () => {
    sidebarInst = btn.dataset.inst;
    document.querySelectorAll('#sidebar [data-inst]').forEach(b => b.classList.toggle('active', b.dataset.inst === sidebarInst));
    renderSidebar();
  });
});

// ============================= AUTO-REFRESH (cada tanto, sin ser cada 2 segundos) =============================
// Mientras la pestaña está abierta y visible: refresca sola cada 5 min.
// Los celulares "pausan" el JS de una pestaña en segundo plano, así que además,
// cuando vuelves a esa pestaña (visibilitychange), si los datos ya tienen más de
// 3 min de viejos, se refrescan solos en ese momento -- para no ver "hace 30000 min".
const AUTO_REFRESH_MS = 5 * 60 * 1000;
const STALE_ON_RETURN_MS = 3 * 60 * 1000;

setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (!getCode() || sessionExpired()) return;
  fetchMode(state.primary + '_' + state.institucion);
  fetchMode('intervenciones_' + sidebarInst, true);
}, AUTO_REFRESH_MS);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!getCode() || sessionExpired()) return;
  touchActivity();
  const mode = state.primary + '_' + state.institucion;
  const cached = getCachedGroups(mode);
  if (!cached || (Date.now() - cached.ts) > STALE_ON_RETURN_MS) fetchMode(mode);
  const sMode = 'intervenciones_' + sidebarInst;
  const sCached = getCachedGroups(sMode);
  if (!sCached || (Date.now() - sCached.ts) > STALE_ON_RETURN_MS) fetchMode(sMode, true);
});

function renderNextPage() {
  const toShow = state.groups.slice(state.renderedCount, state.renderedCount + PAGE_SIZE);
  if (state.renderedCount === 0) contentEl.innerHTML = '';
  if (state.groups.length === 0) {
    contentEl.innerHTML = '<div class="empty">No hay pacientes en esta vista.</div>';
    return;
  }
  toShow.forEach(group => {
    const header = document.createElement('div');
    header.className = 'date-header';
    header.textContent = formatDateLabel(group.date);
    contentEl.appendChild(header);

    const groupWrap = document.createElement('div');
    groupWrap.dataset.date = group.date;
    contentEl.appendChild(groupWrap);

    group.patients.forEach(p => groupWrap.appendChild(renderCard(p, group.date, groupWrap)));
  });
  state.renderedCount += toShow.length;
}

// ============================= CHECKLIST Y ORDEN (guardado en el servidor — sobrevive cerrar la pestaña) =============================
function cardKey(date, p) { return p.id ? p.id : (date + '|' + (p.nombre || '')); }

function setVisto(p, visto) {
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'set_estado', code: getCode(), patientId: p.id, visto: visto }),
  }).catch(() => showToast('No se pudo guardar (sin conexión). Vuelve a marcarlo cuando regrese el internet.', true));
}

function persistGroupOrder(groupWrap) {
  const ids = Array.from(groupWrap.children).map(el => el.dataset.key).filter(Boolean);
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'set_orden', code: getCode(), ids: ids }),
  }).catch(() => showToast('No se pudo guardar el orden (sin conexión).', true));
}

function moveCard(card, groupWrap, dir) {
  const sibling = dir === 'up' ? card.previousElementSibling : card.nextElementSibling;
  if (!sibling) return;
  if (dir === 'up') groupWrap.insertBefore(card, sibling);
  else groupWrap.insertBefore(sibling, card);
  persistGroupOrder(groupWrap);
  syncGroupOrderInState(groupWrap); // así el caché en memoria también refleja el nuevo orden
  touchCacheForCurrentMode();
}

function syncGroupOrderInState(groupWrap) {
  const date = groupWrap.dataset.date;
  const group = state.groups.find(g => g.date === date);
  if (!group) return;
  const byKey = {};
  group.patients.forEach(p => { byKey[cardKey(date, p)] = p; });
  const ordered = Array.from(groupWrap.children).map(el => byKey[el.dataset.key]).filter(Boolean);
  if (ordered.length === group.patients.length) group.patients = ordered;
}

// Carga más grupos cuando el sentinel entra en pantalla (scroll infinito)
const observer = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) renderNextPage();
}, { rootMargin: '200px' });
observer.observe(document.getElementById('sentinel'));

function renderCard(p, date, groupWrap) {
  const card = document.createElement('div');
  card.className = 'card';
  const key = cardKey(date, p);
  card.dataset.key = key;
  if (p.visto) card.classList.add('checked');

  const initials = (p.nombre || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const sub = p.procedimiento ? p.procedimiento : 'Pendiente de valorar';

  card.innerHTML = `
    <div class="card-summary">
      <input type="checkbox" class="check" ${p.visto ? 'checked' : ''}>
      <div class="avatar">${initials}</div>
      <div class="card-summary-text">
        <div class="card-name">${escapeHtml(p.nombre)}${p.edad ? ', ' + escapeHtml(String(p.edad)) : ''}</div>
        <div class="card-sub">${escapeHtml(sub)}</div>
      </div>
      <div class="reorder">
        <button type="button" data-dir="up">▲</button>
        <button type="button" data-dir="down">▼</button>
      </div>
      <div class="chev">▾</div>
    </div>
    <div class="card-detail">
      <div class="detail-row">
        <p><span class="detail-label">ID</span> — ${escapeHtml(p.id || '—')}</p>
        ${p.mainPathology ? `<p><span class="detail-label">Patología</span> — ${escapeHtml(p.mainPathology)}</p>` : ''}
        <p><span class="detail-label">Antecedentes</span> — ${escapeHtml(p.antecedentes || '—')}</p>
        <p><span class="detail-label">Comentario</span> — ${escapeHtml(p.comentario || '—')}</p>
        <p class="detail-label" style="margin-top:8px;">Nota (solo aquí, no va al sheet)</p>
        <textarea class="nota-input" placeholder="Escribe una nota…">${escapeHtml(p.notaApp || '')}</textarea>
        <span class="nota-saved">Guardado</span>
      </div>
      <div class="img-toggle">
        <span>Imágenes</span>
        <span class="chev">▾</span>
      </div>
      <div class="img-panel" tabindex="0"></div>
    </div>
  `;

  card.querySelector('.card-summary').addEventListener('click', () => {
    card.classList.toggle('open');
  });

  const checkbox = card.querySelector('.check');
  checkbox.addEventListener('click', (e) => {
    e.stopPropagation();
    p.visto = checkbox.checked;
    setVisto(p, checkbox.checked);
    card.classList.toggle('checked', checkbox.checked);
    touchCacheForCurrentMode();
  });

  card.querySelectorAll('.reorder button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      moveCard(card, groupWrap, btn.dataset.dir);
    });
  });

  const notaInput = card.querySelector('.nota-input');
  const notaSaved = card.querySelector('.nota-saved');
  notaInput.addEventListener('click', (e) => e.stopPropagation());
  notaInput.addEventListener('blur', () => handleSaveNote(notaInput, notaSaved, p));

  const imgToggle = card.querySelector('.img-toggle');
  const imgPanel = card.querySelector('.img-panel');
  let imgPanelBuilt = false;
  imgToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const opening = !imgPanel.classList.contains('open');
    imgPanel.classList.toggle('open');
    imgToggle.querySelector('.chev').style.transform = opening ? 'rotate(180deg)' : '';
    if (!imgPanelBuilt) { buildImgPanel(imgPanel, p); imgPanelBuilt = true; }
    if (opening) {
      imgPanel.focus();
      // "Arma" este paciente como destino del próximo Ctrl+V (ver listener global de paste)
      activePasteCtx = {
        p: p,
        thumbRow: imgPanel.querySelector('.thumb-row'),
        addTile: imgPanel.querySelector('.thumb-add-wrap'),
        progressEl: imgPanel.querySelector('.upload-progress'),
      };
    } else if (activePasteCtx && activePasteCtx.p === p) {
      activePasteCtx = null;
    }
  });

  return card;
}

// ============================= PEGAR SCREENSHOT (Ctrl+V) — con feedback visible =============================
let activePasteCtx = null;

function showToast(msg, isError) {
  const el = document.getElementById('paste-toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 3000);
}

window.addEventListener('paste', (e) => {
  if (!activePasteCtx) {
    showToast('Ctrl+V detectado, pero no hay un paciente con "Imágenes" abierto. Abre ese toggle primero.', true);
    return;
  }
  const items = (e.clipboardData || window.clipboardData).items;
  let found = false;
  for (const item of items) {
    if (item.type.indexOf('image') === 0) {
      found = true;
      showToast('Imagen detectada, subiendo…');
      handleImageUploadFile(item.getAsFile(), activePasteCtx.p, activePasteCtx.thumbRow, activePasteCtx.addTile, activePasteCtx.progressEl);
      e.preventDefault();
      break;
    }
  }
  if (!found) showToast('Ctrl+V detectado, pero el portapapeles no trae una imagen.', true);
});

function buildImgPanel(panel, p) {
  const thumbRow = document.createElement('div');
  thumbRow.className = 'thumb-row';

  (p.imagenes || []).forEach(img => {
    const im = document.createElement('img');
    im.className = 'thumb';
    im.src = img.thumbUrl;
    im.addEventListener('click', () => window.open(img.fullUrl, '_blank'));
    thumbRow.appendChild(im);
  });

  // Dos botones separados porque en varios navegadores de celular un solo <input file>
  // solo ofrece UNA opción (cámara o galería) según si trae el atributo "capture" o no.
  const addWrap = document.createElement('div');
  addWrap.className = 'thumb-add-wrap';

  const progressEl = document.createElement('span');
  progressEl.className = 'upload-progress';

  const cameraTile = document.createElement('div');
  cameraTile.className = 'thumb-add';
  cameraTile.textContent = '📷';
  cameraTile.title = 'Tomar foto';
  const cameraInput = document.createElement('input');
  cameraInput.type = 'file';
  cameraInput.accept = 'image/*';
  cameraInput.capture = 'environment';
  cameraInput.style.display = 'none';
  cameraTile.addEventListener('click', () => cameraInput.click());
  cameraInput.addEventListener('change', () => {
    const file = cameraInput.files[0];
    if (file) handleImageUploadFile(file, p, thumbRow, addWrap, progressEl);
    cameraInput.value = '';
  });

  const galleryTile = document.createElement('div');
  galleryTile.className = 'thumb-add';
  galleryTile.textContent = '🖼';
  galleryTile.title = 'Subir de galería';
  const galleryInput = document.createElement('input');
  galleryInput.type = 'file';
  galleryInput.accept = 'image/*';
  galleryInput.style.display = 'none';
  galleryTile.addEventListener('click', () => galleryInput.click());
  galleryInput.addEventListener('change', () => {
    const file = galleryInput.files[0];
    if (file) handleImageUploadFile(file, p, thumbRow, addWrap, progressEl);
    galleryInput.value = '';
  });

  addWrap.appendChild(cameraTile);
  addWrap.appendChild(cameraInput);
  addWrap.appendChild(galleryTile);
  addWrap.appendChild(galleryInput);
  addWrap.appendChild(progressEl);

  thumbRow.appendChild(addWrap);
  panel.appendChild(thumbRow);

  const hint = document.createElement('p');
  hint.className = 'paste-hint';
  hint.textContent = 'En computadora: con este cuadro seleccionado, Ctrl+V pega un screenshot directo.';
  panel.appendChild(hint);

  const linkList = document.createElement('div');
  linkList.className = 'link-list';

  if (p.dicomLinkSheet) {
    linkList.appendChild(makeLinkEl(p.dicomLinkSheet, 'DICOM viewer', 'sheet'));
  }
  (p.links || []).forEach(l => linkList.appendChild(makeLinkEl(l.url, l.label || l.url, l.origen || '')));

  const addRow = document.createElement('div');
  addRow.className = 'link-add-row';
  addRow.innerHTML = `<input type="text" placeholder="Pega un link…"><button>Agregar</button>`;
  const input = addRow.querySelector('input');
  const btn = addRow.querySelector('button');
  btn.addEventListener('click', () => handleAddLink(input, p, linkList));

  panel.appendChild(linkList);
  panel.appendChild(addRow);
}

async function handleSaveNote(input, savedLabel, p) {
  const nota = input.value;
  if (nota === (p.notaApp || '')) return; // no cambió, no gastes una llamada
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'save_note', code: getCode(), patientId: p.id, nota: nota }),
    });
    const data = await res.json();
    if (data.error === 'codigo_invalido' || data.error === 'No autorizado') { rejectCode(); return; }
    if (!data.ok) throw new Error(data.error);
    p.notaApp = nota;
    touchCacheForCurrentMode();
    savedLabel.classList.add('show');
    setTimeout(() => savedLabel.classList.remove('show'), 1500);
  } catch (err) {
    alert('No se pudo guardar la nota: ' + err);
  }
}

function makeLinkEl(url, label, tag) {
  const a = document.createElement('a');
  a.className = 'link-item';
  a.href = url;
  a.target = '_blank';
  a.innerHTML = `↗ ${escapeHtml(label)} ${tag ? `<span class="tag">${escapeHtml(tag)}</span>` : ''}`;
  return a;
}

// POST con seguimiento real de progreso de subida (fetch no lo da de forma confiable en todos los navegadores).
function postWithProgress(bodyObj, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', API_URL, true);
    xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8'); // evita preflight CORS
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch (err) { reject(new Error('respuesta_invalida')); }
    };
    xhr.onerror = () => reject(new Error('error_de_red'));
    xhr.send(JSON.stringify(bodyObj));
  });
}

async function handleImageUploadFile(file, p, thumbRow, addTile, progressEl) {
  if (!file || !p || !thumbRow || !addTile) return;
  addTile.classList.add('busy');
  if (progressEl) progressEl.textContent = 'Preparando…';
  try {
    const base64 = await fileToBase64(file);
    if (progressEl) progressEl.textContent = 'Subiendo 0%';
    const data = await postWithProgress({
      action: 'upload_image',
      code: getCode(),
      patientId: p.id,
      filename: file.name,
      mimeType: file.type,
      base64: base64,
    }, (pct) => { if (progressEl) progressEl.textContent = 'Subiendo ' + pct + '%'; });
    if (data.error === 'codigo_invalido' || data.error === 'No autorizado') { rejectCode(); return; }
    if (!data.ok) throw new Error(data.error);
    const im = document.createElement('img');
    im.className = 'thumb';
    im.src = data.thumbUrl;
    im.addEventListener('click', () => window.open(data.fullUrl, '_blank'));
    thumbRow.insertBefore(im, addTile);
    p.imagenes = (p.imagenes || []).concat([{ thumbUrl: data.thumbUrl, fullUrl: data.fullUrl, origen: 'app' }]);
    touchCacheForCurrentMode();
    showToast('Imagen subida ✓');
  } catch (err) {
    showToast('Error al subir la imagen: ' + err, true);
  } finally {
    addTile.classList.remove('busy');
    if (progressEl) progressEl.textContent = '';
  }
}

async function handleAddLink(input, p, linkList) {
  const url = input.value.trim();
  if (!url) return;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'add_link', code: getCode(), patientId: p.id, url: url }),
    });
    const data = await res.json();
    if (data.error === 'codigo_invalido' || data.error === 'No autorizado') { rejectCode(); return; }
    if (!data.ok) throw new Error(data.error);
    linkList.appendChild(makeLinkEl(url, url, 'app'));
    p.links = (p.links || []).concat([{ url: url, label: url, origen: 'app' }]);
    touchCacheForCurrentMode();
    input.value = '';
  } catch (err) {
    alert('No se pudo agregar el link: ' + err);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function formatDateLabel(dateStr) {
  if (dateStr === 'sin-fecha') return 'Sin fecha';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}
